<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#556040">
<title>NutriSan – Consultorio de Nutrición</title>
<script>if(/^#[ps]=/.test(location.hash))document.documentElement.style.visibility="hidden";</script>
<style>
:root{
  --bg:#f5f6f4; --panel:#ffffff; --ink:#1f2a24; --muted:#66736b; --line:#dde3de;
  --accent:#556040; --cream:#EED5AE; --cream-soft:#f7efe2; --accent-soft:#eef0e1; --warn:#b5651d; --warn-soft:#fbeedd; --bad:#b03a2e; --bad-soft:#f9e1de; --ok:#556040;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button,input,select,textarea{font:inherit}
header.top{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--accent);color:#fff}
header.top h1{font-size:18px;margin:0;font-weight:600}
header.top .sp{flex:1}
header.top button{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:6px 10px;cursor:pointer}
header.top button:hover{background:rgba(255,255,255,.28)}
#estadoGuardado{font-size:12px;opacity:.9}
.layout{display:grid;grid-template-columns:270px 1fr;height:calc(100vh - 52px)}
aside{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
aside .tools{padding:12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
aside input{width:100%}
#listaPacientes{overflow:auto;flex:1}
.pac{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.pac:hover{background:var(--accent-soft)}
.pac.sel{background:var(--accent-soft);border-left:4px solid var(--accent);padding-left:10px}
.pac b{display:block}
.pac small{color:var(--muted)}
main{overflow:auto;padding:18px 24px;min-width:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tab{padding:8px 14px;border:none;background:none;cursor:pointer;border-bottom:3px solid transparent;color:var(--muted);font-weight:600}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 14px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
textarea{min-height:64px;resize:vertical}
.btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn.sec{background:#fff;color:var(--accent);border:1px solid var(--accent)}
.btn.del{background:#fff;color:var(--bad);border:1px solid var(--bad)}
.btn:hover{filter:brightness(1.05)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.checks{display:flex;flex-wrap:wrap;gap:6px 16px}
.checks label{flex-direction:row;align-items:center;color:var(--ink);font-size:14px}
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.r{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fbfcfb}
.r .k{font-size:12px;color:var(--muted)}
.r .v{font-size:20px;font-weight:700;margin:2px 0}
.r .t{font-size:12px;border-radius:6px;padding:2px 6px;display:inline-block}
.t.ok{background:var(--accent-soft);color:var(--ok)}
.t.warn{background:var(--warn-soft);color:var(--warn)}
.t.bad{background:var(--bad-soft);color:var(--bad)}
.t.na{background:#eef0ee;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px}
.empty{color:var(--muted);text-align:center;padding:50px 10px}
.charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.chart svg{width:100%;height:auto}
.note{font-size:12px;color:var(--muted)}
.subt{font-size:13px;font-weight:700;margin:14px 0 6px;color:var(--accent)}
dialog{border:none;border-radius:14px;padding:20px;max-width:460px;width:92%}
dialog::backdrop{background:rgba(0,0,0,.35)}
#print-area{display:none}
.pa-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--accent);padding-bottom:8px}
.pa-page h1{font-size:20px;margin:0}
.pa-page h2{font-size:15px;margin:16px 0 6px;color:var(--accent);border-bottom:1px solid var(--line);padding-bottom:3px}

header.top .acciones{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header.top .tagline{display:block;font-size:10px;letter-spacing:.16em;color:var(--cream);opacity:.9;font-weight:400;margin-top:1px}
.btnMenu,.btnPacs{display:none}
.pac.sel{border-left-color:var(--accent)}
aside .tools{background:var(--cream-soft)}
/* Portal del paciente */
.portalWrap{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:18px;align-items:start}
.metaFila{display:grid;grid-template-columns:1fr 150px 36px;gap:8px;margin-bottom:8px}
.metaFila input,.metaFila select{min-width:0;width:100%}
.metaFila button{border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;color:var(--bad)}
.telefono{position:sticky;top:10px;background:#1f2a24;border-radius:34px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.telefono iframe{width:100%;height:700px;border:0;border-radius:24px;background:#fff;display:block}
.telefono .cap{color:#cfd5d0;font-size:12px;text-align:center;padding:2px 0 8px}
.aviso{background:var(--cream-soft);border:1px solid var(--cream);border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:16px}
@media (max-width:1100px){ .portalWrap{grid-template-columns:minmax(0,1fr)} .telefono{position:static;max-width:420px;margin:0 auto} }
/* ---------- Celular ---------- */
@media (max-width:820px){
  body{font-size:16px}
  input,select,textarea{font-size:16px}
  header.top{flex-wrap:wrap;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));position:sticky;top:0;z-index:30;gap:10px}
  header.top h1 > span,#profHeader{display:none}
  header.top .btnMenu{display:inline-block;font-size:18px;line-height:1;padding:6px 11px}
  header.top .acciones{display:none;width:100%;flex-direction:column;align-items:stretch}
  header.top.abierto .acciones{display:flex}
  header.top .acciones button{padding:10px;text-align:left}
  #estadoGuardado{font-size:11px}
  .layout{display:block;height:auto}
  aside{border-right:none;min-height:calc(100vh - 56px)}
  body.conPac aside{display:none}
  body:not(.conPac) main{display:none}
  .pac{padding:14px 16px}
  main{padding:12px 12px 40px}
  main h2{font-size:19px}
  .btnPacs{display:inline-block}
  .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;margin-left:-12px;margin-right:-12px;padding:0 6px}
  .tab{white-space:nowrap;padding:10px 12px}
  .card{padding:12px;border-radius:10px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .grid[style*="1fr 1fr"]{grid-template-columns:1fr!important}
  .charts{grid-template-columns:1fr}
  .res{grid-template-columns:1fr 1fr}
  .r .v{font-size:18px}
  main table{display:block;overflow-x:auto;white-space:nowrap}
  .btn{padding:11px 14px}
  .metaFila{grid-template-columns:1fr 120px 36px}
  dialog{padding:16px}
}
@media (max-width:420px){ .res{grid-template-columns:1fr} #estadoGuardado{display:none} }
#acceso{position:fixed;inset:0;z-index:100;background:var(--accent);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.accCaja{background:#fff;border-radius:22px;padding:28px 22px;width:100%;max-width:360px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.accCaja img{width:96px;height:96px;border-radius:50%}
.accMarca{font-size:24px;font-weight:700;color:var(--accent);margin-top:6px}.accTag{font-size:10px;letter-spacing:.18em;color:#8a7a5a;margin-bottom:20px}
.accBtn{display:block;width:100%;padding:14px;margin:10px 0;border-radius:12px;border:2px solid var(--accent);background:var(--accent);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.accBtn.sec{background:var(--cream-soft);color:var(--accent);border-color:var(--cream)}
.accCaja input{width:100%;font-size:22px;text-align:center;letter-spacing:.3em;padding:10px;margin:6px 0;border-radius:10px}
.accCaja p{font-size:14.5px;color:var(--ink);line-height:1.45}.accNota{color:var(--muted)!important;font-size:13px!important}
.accErr{color:var(--bad);font-size:13px;min-height:18px}.accLink{background:none;border:none;color:var(--muted);cursor:pointer;margin-top:4px;font-size:14px}
[hidden]{display:none!important}
@media print{
  body{background:#fff}
  header.top,.layout{display:none!important}
  #print-area{display:block}
  .pa-page{font-size:12.5px}
  .pa-page h1{font-size:18px;margin:0}

<script>
"use strict";
/* ================== DATOS ================== */
const KEY = "consultorio_nutricion_v1";
const PROFESIONAL = "Lic. Agustina Ayelén Sandoval";
const WEB_NUTRISAN = "https://victornavarro854-hue.github.io/nutrisan/";
let db = cargar();
db.profesional = Object.assign({}, db.profesional, {nombre: PROFESIONAL});
if(!db.profesional.web) db.profesional.web = WEB_NUTRISAN;
let selId = null, tabActual = "ficha", evalEditId = null;

function nuevoDB(){ return {version:1, profesional:{nombre:PROFESIONAL, titulo:"Nutrición – Antropometría – Enfermedades crónicas no transmisibles", matricula:"", contacto:""}, pacientes:[]}; }
function cargar(){ try{ const s = localStorage.getItem(KEY); if(s) return JSON.parse(s); }catch(e){} return nuevoDB(); }

let tGuardar=null;
function guardar(){
  try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){ alert("No se pudo guardar en el navegador. Usá 'Guardar copia'."); }
  marcarEstado("Guardado ✓");
  if(fileHandle){ clearTimeout(tGuardar); tGuardar=setTimeout(escribirArchivo, 600); }
}
async function escribirArchivo(){
  try{ const w = await fileHandle.createWritable(); await w.write(JSON.stringify(db,null,1)); await w.close(); marcarEstado("Guardado ✓ + archivo"); }
  catch(e){ marcarEstado("⚠ No se pudo escribir el archivo"); }
}
function marcarEstado(t){ const el=document.getElementById("estadoGuardado"); el.textContent=t; }
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pac = () => db.pacientes.find(p=>p.id===selId);
const soloNum = s => String(s??"").replace(/\D/g,"");
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { if(v===""||v==null) return null; const n = parseFloat(String(v).replace(",",".")); return isNaN(n)?null:n; };
const r1 = v => v==null||isNaN(v) ? "–" : (Math.round(v*10)/10).toLocaleString("es-AR");
const r2 = v => v==null||isNaN(v) ? "–" : (Math.round(v*100)/100).toLocaleString("es-AR");
const hoy = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const fmtF = f => f ? f.split("-").reverse().join("/") : "";

/* ================== CÁLCULOS ================== */
function edadEn(nac, fecha){
  if(!nac) return null; const a=new Date(nac), b=new Date(fecha||hoy());
  let e=b.getFullYear()-a.getFullYear(); const m=b.getMonth()-a.getMonth();
  if(m<0||(m===0&&b.getDate()<a.getDate())) e--; return e;
}
function clasIMC(i){
  if(i==null) return ["–","na"];
  if(i<18.5) return ["Bajo peso","warn"]; if(i<25) return ["Normopeso","ok"]; if(i<30) return ["Sobrepeso","warn"];
  if(i<35) return ["Obesidad grado I","bad"]; if(i<40) return ["Obesidad grado II","bad"]; return ["Obesidad grado III","bad"];
}
// Durnin & Womersley (1974) – coeficientes c y m por sexo y edad; Σ bíceps+tríceps+subescapular+cresta ilíaca
const DW = { M:[[17,19,1.1620,0.0630],[20,29,1.1631,0.0632],[30,39,1.1422,0.0544],[40,49,1.1620,0.0700],[50,200,1.1715,0.0779]],
             F:[[16,19,1.1549,0.0678],[20,29,1.1599,0.0717],[30,39,1.1423,0.0632],[40,49,1.1333,0.0612],[50,200,1.1339,0.0645]] };
function calcular(p, ev){
  const R = {};
  const peso=num(ev.peso), talla=num(ev.talla), edad=edadEn(p.nacimiento, ev.fecha), sx=p.sexo;
  const pl = ev.pliegues||{}, d = ev.diam||{};
  R.edad = edad;
  if(peso && talla){ R.imc = peso/Math.pow(talla/100,2); }
  R.imcClas = clasIMC(R.imc);
  const cin=num(ev.cintura), cad=num(ev.cadera);
  if(cin){
    const [a,b] = sx==="M"?[94,102]:[80,88];
    R.cinClas = cin>=b?["Riesgo muy aumentado","bad"]:cin>=a?["Riesgo aumentado","warn"]:["Sin riesgo aumentado","ok"];
  }
  if(cin&&cad){ R.icc=cin/cad; const lim = sx==="M"?0.90:0.85; R.iccClas = R.icc>=lim?["Riesgo aumentado","bad"]:["Normal","ok"]; }
  if(cin&&talla){ R.ict=cin/talla; R.ictClas = R.ict>=0.6?["Riesgo alto","bad"]:R.ict>=0.5?["Riesgo aumentado","warn"]:["Normal","ok"]; }
  // Σ pliegues
  const P = k => num(pl[k]);
  const s6k=["triceps","subescapular","supraespinal","abdominal","muslo","pantorrilla"];
  if(s6k.every(k=>P(k)!=null)) R.s6 = s6k.reduce((a,k)=>a+P(k),0);
  // Durnin-Womersley + Siri
  const dwk=["biceps","triceps","subescapular","crestaIliaca"];
  if(dwk.every(k=>P(k)!=null) && edad!=null && (sx==="M"||sx==="F")){
    const s4 = dwk.reduce((a,k)=>a+P(k),0); R.s4=s4;
    const fila = DW[sx].find(f=>edad>=f[0]&&edad<=f[1]) || (edad<DW[sx][0][0]?DW[sx][0]:null);
    if(fila){
      const D = fila[2]-fila[3]*Math.log10(s4); R.densidad=D; R.grasa=(4.95/D-4.50)*100;
      if(peso){ R.mg=peso*R.grasa/100; R.mlg=peso-R.mg; }
      R.grasaNota = edad<fila[0] ? "Edad menor al rango de la ecuación: interpretar con cautela." : "";
    }
  }
  // Somatotipo Heath-Carter
  if(P("triceps")!=null&&P("subescapular")!=null&&P("supraespinal")!=null&&talla){
    const X=(P("triceps")+P("subescapular")+P("supraespinal"))*170.18/talla;
    R.endo=-0.7182+0.1451*X-0.00068*X*X+0.0000014*X*X*X;
  }
  const hum=num(d.humero), fem=num(d.femur), bc=num(ev.brazoCon), pan=num(ev.pantorrilla);
  if(hum&&fem&&bc&&pan&&talla&&P("triceps")!=null&&P("pantorrilla")!=null){
    R.meso=0.858*hum+0.601*fem+0.188*(bc-P("triceps")/10)+0.161*(pan-P("pantorrilla")/10)-0.131*talla+4.5;
  }
  if(peso&&talla){
    const hwr=talla/Math.cbrt(peso); R.hwr=hwr;
    R.ecto = hwr>=40.75 ? 0.732*hwr-28.58 : hwr>38.25 ? 0.463*hwr-17.63 : 0.1;
  }
  // Dinamometría
  const dn = ev.dina||{};
  const vals = a => (a||[]).map(num).filter(v=>v!=null);
  const der=vals(dn.der), izq=vals(dn.izq);
  if(der.length) R.dDer=Math.max(...der);
  if(izq.length) R.dIzq=Math.max(...izq);
  if(R.dDer!=null||R.dIzq!=null){
    R.dMax=Math.max(R.dDer??0,R.dIzq??0);
    if(R.dDer!=null&&R.dIzq!=null){
      const dom = dn.dominante==="izq"?R.dIzq:R.dDer, nodom = dn.dominante==="izq"?R.dDer:R.dIzq;
      R.asim = Math.abs(R.dDer-R.dIzq)/Math.max(R.dDer,R.dIzq)*100;
      R.asimClas = R.asim>10?["Asimetría >10%","warn"]:["Simétrica","ok"];
      R.domRatio = dom&&nodom ? dom/nodom : null;
    }
    if(peso) R.dRel=R.dMax/peso;
    if(sx==="M"||sx==="F"){
      const corte = sx==="M"?27:16;
      R.dClas = R.dMax<corte?["Fuerza baja (EWGSOP2 <"+corte+" kg)","bad"]:["Fuerza conservada","ok"];
    }
  }
  return R;
}
function gastoEnergetico(p, ev, factor){
  const peso=num(ev.peso), talla=num(ev.talla), edad=edadEn(p.nacimiento, ev.fecha);
  if(!peso||!talla||edad==null||!(p.sexo==="M"||p.sexo==="F")) return null;
  const tmb = 10*peso+6.25*talla-5*edad+(p.sexo==="M"?5:-161);
  return {tmb, get: tmb*(num(factor)||1.2)};
}

function renderLista(){
  const q=(document.getElementById("buscar").value||"").toLowerCase(); const qd=soloNum(q);
  const cont=document.getElementById("listaPacientes");
  const ps=[...db.pacientes].sort((a,b)=>(a.nombre||"").localeCompare(b.nombre||"")).filter(p=>!q||(p.nombre||"").toLowerCase().includes(q)||(p.codigo||"").toLowerCase().includes(q)||(qd&&soloNum(p.dni).includes(qd)));
  if(!ps.length){ cont.innerHTML='<div class="empty" style="padding:30px 10px">Sin pacientes todavía</div>'; return; }
  cont.innerHTML = ps.map(p=>{
    const u = ultimaEval(p);
    return `<div class="pac ${p.id===selId?"sel":""}" data-id="${p.id}"><b>${esc(p.nombre||"(sin nombre)")}</b><small>${p.dni?"DNI "+esc(p.dni)+" ":""}${esc(p.codigo||"")} ${p.nacimiento?"· "+edadEn(p.nacimiento)+" años":""} ${u?"· últ. "+fmtF(u.fecha):""}</small></div>`;
  }).join("");
  cont.querySelectorAll(".pac").forEach(el=>el.onclick=()=>{ selId=el.dataset.id; evalEditId=null; renderLista(); render(); window.scrollTo(0,0); });
}
const ordenadas = p => [...(p.evaluaciones||[])].sort((a,b)=>a.fecha.localeCompare(b.fecha));
const ultimaEval = p => { const o=ordenadas(p); return o[o.length-1]; };

/* ---- Ficha ---- */
function vFicha(p, el){
  el.innerHTML = `
  <div class="card"><h3>Datos personales</h3><div class="grid">
    <label>Nombre y apellido<input data-f="nombre" value="${esc(p.nombre)}"></label>
    <label>DNI<input data-f="dni" inputmode="numeric" value="${esc(p.dni)}"><span id="dniAviso" style="color:var(--bad)"></span></label>
    <label>Código / historia clínica<input data-f="codigo" value="${esc(p.codigo)}"></label>
    <label>Sexo<select data-f="sexo"><option value="">–</option><option value="F" ${p.sexo==="F"?"selected":""}>Femenino</option><option value="M" ${p.sexo==="M"?"selected":""}>Masculino</option></select></label>
    <label>Fecha de nacimiento<input type="date" data-f="nacimiento" value="${esc(p.nacimiento)}"></label>
    <label>Teléfono<input data-f="telefono" value="${esc(p.telefono)}"></label>
    <label>Ocupación<input data-f="ocupacion" value="${esc(p.ocupacion)}"></label>
  </div><p class="note">Edad actual: ${p.nacimiento?edadEn(p.nacimiento)+" años":"–"}</p></div>
  <div class="card"><h3>Antecedentes y enfermedades crónicas</h3>
    <div class="checks">${ANTEC.map(a=>`<label><input type="checkbox" data-a="${esc(a)}" ${(p.antecedentes||[]).includes(a)?"checked":""}> ${esc(a)}</label>`).join("")}</div>
    <div class="grid" style="margin-top:12px;grid-template-columns:1fr 1fr">
      <label>Otros antecedentes / familiares<textarea data-f="otrosAntecedentes">${esc(p.otrosAntecedentes)}</textarea></label>
      <label>Medicación y suplementos<textarea data-f="medicacion">${esc(p.medicacion)}</textarea></label>
    </div></div>
  <div class="card"><h3>Consulta</h3><div class="grid" style="grid-template-columns:1fr 1fr">
    <label>Motivo de consulta<textarea data-f="motivo">${esc(p.motivo)}</textarea></label>
    <label>Objetivos acordados<textarea data-f="objetivo">${esc(p.objetivo)}</textarea></label>
    <label>Actividad física (tipo, frecuencia, duración)<textarea data-f="actividad">${esc(p.actividad)}</textarea></label>
    <label>Hábitos alimentarios / recordatorio 24 h<textarea data-f="habitos">${esc(p.habitos)}</textarea></label>
    <label style="grid-column:1/-1">Notas<textarea data-f="notas">${esc(p.notas)}</textarea></label>
  </div></div>
  <div class="row"><button class="btn del" id="btnBorrarPac">Eliminar paciente</button></div>`;
  el.querySelectorAll("[data-f]").forEach(i=>i.oninput=i.onchange=()=>{ p[i.dataset.f]=i.value; guardar(); if(["nombre","codigo","nacimiento","dni"].includes(i.dataset.f)) renderLista(); if(i.dataset.f==="dni") avisoDni(p); });
  avisoDni(p);
  el.querySelectorAll("[data-a]").forEach(c=>c.onchange=()=>{ p.antecedentes=[...el.querySelectorAll("[data-a]:checked")].map(x=>x.dataset.a); guardar(); });
  el.querySelector("#btnBorrarPac").onclick=()=>{
    if(confirm("¿Eliminar a "+(p.nombre||"este paciente")+" y todas sus evaluaciones? No se puede deshacer.")){
      db.pacientes=db.pacientes.filter(x=>x.id!==p.id); selId=null; guardar(); renderLista(); render();
    }
  };
}

function avisoDni(p){
  const el=document.getElementById("dniAviso"); if(!el) return; const d=soloNum(p.dni);
  const otro = d && db.pacientes.find(x=>x.id!==p.id && soloNum(x.dni)===d);
  el.textContent = otro ? "⚠ Este DNI ya está cargado en: "+(otro.nombre||"otro paciente") : "";
}
/* ---- Evaluaciones ---- */
const PL = [["triceps","Tríceps"],["subescapular","Subescapular"],["biceps","Bíceps"],["crestaIliaca","Cresta ilíaca"],["supraespinal","Supraespinal"],["abdominal","Abdominal"],["muslo","Muslo frontal"],["pantorrilla","Pantorrilla"]];
function vEval(p, el){
  const evs = ordenadas(p).reverse();
  if(evalEditId){ return formEval(p, el, p.evaluaciones.find(e=>e.id===evalEditId)); }
  el.innerHTML = `<div class="row" style="margin-bottom:12px"><button class="btn" id="btnNuevaEval">+ Nueva evaluación</button>
    ${evs.length?'<span class="note">Hacé clic en una evaluación para verla o editarla.</span>':""}</div>
    ${evs.length?`<div class="card"><table><tr><th>Fecha</th><th>Peso</th><th>IMC</th><th>Cintura</th><th>% grasa</th><th>Σ6 pliegues</th><th>Fuerza máx.</th></tr>
    ${evs.map(e=>{const R=calcular(p,e);return `<tr style="cursor:pointer" data-e="${e.id}"><td>${fmtF(e.fecha)}</td><td>${r1(num(e.peso))} kg</td><td>${r1(R.imc)}</td><td>${r1(num(e.cintura))} cm</td><td>${r1(R.grasa)}%</td><td>${r1(R.s6)} mm</td><td>${r1(R.dMax)} kg</td></tr>`}).join("")}</table></div>`
    :'<div class="empty">Todavía no hay evaluaciones.</div>'}`;
  el.querySelector("#btnNuevaEval").onclick=()=>{
    const prev = ultimaEval(p);
    const e={id:uid(), fecha:hoy(), talla: prev?prev.talla:"", pliegues:{}, diam:{}, dina:{der:["","",""],izq:["","",""],dominante: prev&&prev.dina?prev.dina.dominante:"der"}};
    (p.evaluaciones=p.evaluaciones||[]).push(e); evalEditId=e.id; guardar(); render();
  };
  el.querySelectorAll("[data-e]").forEach(tr=>tr.onclick=()=>{evalEditId=tr.dataset.e; render();});
}
function formEval(p, el, e){
  e.pliegues=e.pliegues||{}; e.diam=e.diam||{}; e.dina=e.dina||{der:["","",""],izq:["","",""],dominante:"der"};
  const inp=(path,lab,unit,step="0.1")=>`<label>${lab}${unit?` (${unit})`:""}<input type="number" step="${step}" data-p="${path}" value="${esc(getP(e,path))}"></label>`;
  el.innerHTML = `
  <div class="row" style="margin-bottom:12px"><button class="btn sec" id="btnVolver">← Volver a la lista</button>
  <label style="flex-direction:row;align-items:center;gap:8px">Fecha <input type="date" data-p="fecha" value="${esc(e.fecha)}"></label></div>
  ${!p.sexo||!p.nacimiento?'<div class="card" style="background:var(--warn-soft)">⚠ Para los cálculos completos cargá el <b>sexo</b> y la <b>fecha de nacimiento</b> en la Ficha.</div>':""}
  <div class="card"><h3>Medidas básicas</h3><div class="grid">
    ${inp("peso","Peso","kg")}${inp("talla","Talla","cm")}${inp("paSist","Presión sistólica","mmHg","1")}${inp("paDiast","Presión diastólica","mmHg","1")}
  </div></div>
  <div class="card"><h3>Perímetros (cm)</h3><div class="grid">
    ${inp("cintura","Cintura","")}${inp("cadera","Cadera","")}${inp("brazoRel","Brazo relajado","")}${inp("brazoCon","Brazo flexionado y contraído","")}${inp("musloMedio","Muslo medio","")}${inp("pantorrilla","Pantorrilla","")}
  </div></div>
  <div class="card"><h3>Pliegues cutáneos (mm)</h3><div class="grid">${PL.map(([k,t])=>inp("pliegues."+k,t,"")).join("")}</div>
    <p class="note">% de grasa (Durnin y Womersley): bíceps + tríceps + subescapular + cresta ilíaca. Somatotipo: tríceps, subescapular, supraespinal y pantorrilla. Σ6: tríceps, subescapular, supraespinal, abdominal, muslo y pantorrilla.</p></div>
  <div class="card"><h3>Diámetros óseos (cm)</h3><div class="grid">${inp("diam.humero","Biepicondíleo de húmero","")}${inp("diam.femur","Biepicondíleo de fémur","")}${inp("diam.muneca","Biestiloideo (muñeca)","")}</div></div>
  <div class="card"><h3>Dinamometría (fuerza de prensión manual, kg)</h3>
    <div class="grid">
      ${[0,1,2].map(i=>inp("dina.der."+i,"Derecha – intento "+(i+1),"")).join("")}
      ${[0,1,2].map(i=>inp("dina.izq."+i,"Izquierda – intento "+(i+1),"")).join("")}
      <label>Mano dominante<select data-p="dina.dominante"><option value="der" ${e.dina.dominante!=="izq"?"selected":""}>Derecha</option><option value="izq" ${e.dina.dominante==="izq"?"selected":""}>Izquierda</option></select></label>
    </div><p class="note">Se toma el mejor intento de cada mano.</p></div>
  <div class="card"><h3>Observaciones</h3><textarea data-p="notas" style="width:100%">${esc(e.notas)}</textarea></div>
  <div class="card"><h3>Resultados</h3><div id="resultados"></div></div>
  <div class="row"><button class="btn" id="btnListo">Listo</button><button class="btn del" id="btnBorrarEval">Eliminar evaluación</button></div>`;
  const pintar=()=>{ document.getElementById("resultados").innerHTML = htmlResultados(p,e); };
  el.querySelectorAll("[data-p]").forEach(i=>i.oninput=i.onchange=()=>{ setP(e,i.dataset.p,i.value); guardar(); pintar(); });
  el.querySelector("#btnVolver").onclick=el.querySelector("#btnListo").onclick=()=>{evalEditId=null; renderLista(); render();};
  el.querySelector("#btnBorrarEval").onclick=()=>{ if(confirm("¿Eliminar esta evaluación?")){ p.evaluaciones=p.evaluaciones.filter(x=>x.id!==e.id); evalEditId=null; guardar(); render(); } };
  pintar();
}
function getP(o,path){ return path.split(".").reduce((a,k)=>a==null?a:a[k], o) ?? ""; }
function setP(o,path,v){ const ks=path.split("."); let a=o; ks.slice(0,-1).forEach(k=>{ if(a[k]==null) a[k]={}; a=a[k]; }); a[ks[ks.length-1]]=v; }
function caja(k,v,clas,extra=""){ return `<div class="r"><div class="k">${k}</div><div class="v">${v}</div>${clas?`<span class="t ${clas[1]}">${esc(clas[0])}</span>`:""}${extra?`<div class="note">${extra}</div>`:""}</div>`; }
function htmlResultados(p,e){
  const R=calcular(p,e);
  let h = `<div class="subt">Composición e índices de riesgo</div><div class="res">`;
  h+=caja("IMC (kg/m²)", r1(R.imc), R.imc?R.imcClas:null);
  if(R.cinClas) h+=caja("Perímetro de cintura", r1(num(e.cintura))+" cm", R.cinClas);
  if(R.icc!=null) h+=caja("Índice cintura/cadera", r2(R.icc), R.iccClas);
  if(R.ict!=null) h+=caja("Índice cintura/talla", r2(R.ict), R.ictClas);
  if(R.grasa!=null){ h+=caja("% de grasa (D&W + Siri)", r1(R.grasa)+"%", null, R.grasaNota||""); h+=caja("Masa grasa / masa libre de grasa", r1(R.mg)+" / "+r1(R.mlg)+" kg"); }
  if(R.s6!=null) h+=caja("Σ6 pliegues", r1(R.s6)+" mm");
  if(num(e.paSist)&&num(e.paDiast)){ const s=num(e.paSist), d=num(e.paDiast); h+=caja("Presión arterial", s+"/"+d+" mmHg", s>=140||d>=90?["Elevada (≥140/90)","bad"]:s>=130||d>=85?["Normal alta","warn"]:["Normal","ok"]); }
  h+=`</div>`;
  if(R.endo!=null||R.meso!=null||R.ecto!=null){
    h+=`<div class="subt">Somatotipo (Heath-Carter)</div><div class="res">${caja("Endomorfia",r1(R.endo))}${caja("Mesomorfia",r1(R.meso), null, R.meso==null?"Faltan diámetros, brazo contraído o pantorrilla":"")}${caja("Ectomorfia",r1(R.ecto),null,"Índice ponderal: "+r1(R.hwr))}</div>`;
  }
  if(R.dMax!=null){
    h+=`<div class="subt">Dinamometría</div><div class="res">${caja("Mejor derecha / izquierda", r1(R.dDer)+" / "+r1(R.dIzq)+" kg")}${caja("Fuerza máxima", r1(R.dMax)+" kg", R.dClas)}${R.asim!=null?caja("Diferencia entre manos", r1(R.asim)+"%", R.asimClas):""}${R.dRel!=null?caja("Fuerza relativa", r2(R.dRel)+" kg/kg peso"):""}</div>
    <p class="note">Punto de corte EWGSOP2 para fuerza baja: &lt;27 kg en hombres y &lt;16 kg en mujeres (pensado para adultos y adultos mayores).</p>`;
  }
  return h;
}

/* ---- Evolución ---- */
function svgLinea(titulo, puntos, unidad){
  const W=340,H=180,pl=40,pr=12,pt=26,pb=34;
  const ps=puntos.filter(x=>x.v!=null);
  if(ps.length<1) return `<div class="card chart"><h3>${titulo}</h3><div class="note">Sin datos todavía.</div></div>`;
  let mn=Math.min(...ps.map(x=>x.v)), mx=Math.max(...ps.map(x=>x.v)); if(mn===mx){mn-=1;mx+=1;} const pad=(mx-mn)*0.15; mn-=pad; mx+=pad;
  const X=i=> ps.length===1? (pl+W-pr)/2 : pl+i*(W-pl-pr)/(ps.length-1);
  const Y=v=> pt+(mx-v)*(H-pt-pb)/(mx-mn);
  const ticks=[mn+(mx-mn)*0.1, (mn+mx)/2, mx-(mx-mn)*0.1];
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(titulo)}">`;
  ticks.forEach(t=>{ s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(t)}" y2="${Y(t)}" stroke="#e4e8e5"/><text x="${pl-6}" y="${Y(t)+4}" font-size="10" text-anchor="end" fill="#66736b">${r1(t)}</text>`; });
  s+=`<polyline fill="none" stroke="#556040" stroke-width="2.5" points="${ps.map((x,i)=>X(i)+","+Y(x.v)).join(" ")}"/>`;
  ps.forEach((x,i)=>{ s+=`<circle cx="${X(i)}" cy="${Y(x.v)}" r="4" fill="#556040"/><text x="${X(i)}" y="${Y(x.v)-8}" font-size="10" text-anchor="middle" fill="#1f2a24">${r1(x.v)}</text>`;
    if(ps.length<=8||i===0||i===ps.length-1) s+=`<text x="${X(i)}" y="${H-12}" font-size="9.5" text-anchor="middle" fill="#66736b">${fmtF(x.f).slice(0,5)}${ps.length<=8?"":"/"+x.f.slice(2,4)}</text>`; });
  s+=`</svg>`;
  const dif = ps.length>1 ? ps[ps.length-1].v-ps[0].v : null;
  return `<div class="card chart"><h3>${titulo}${dif!=null?` <span class="note">(${dif>0?"+":""}${r1(dif)} ${unidad} desde el inicio)</span>`:""}</h3>${s}</div>`;
}
function datosEvol(p){
  return ordenadas(p).map(e=>{ const R=calcular(p,e); return {f:e.fecha, peso:num(e.peso), imc:R.imc, cin:num(e.cintura), grasa:R.grasa, s6:R.s6, mlg:R.mlg, fuerza:R.dMax}; });
}
function graficos(p){
  const d=datosEvol(p); const g=(k)=>d.map(x=>({f:x.f,v:x[k]}));
  return `<div class="charts">${svgLinea("Peso (kg)",g("peso"),"kg")}${svgLinea("IMC",g("imc"),"")}${svgLinea("Cintura (cm)",g("cin"),"cm")}${svgLinea("% de grasa",g("grasa"),"%")}${svgLinea("Σ6 pliegues (mm)",g("s6"),"mm")}${svgLinea("Masa libre de grasa (kg)",g("mlg"),"kg")}${svgLinea("Fuerza de prensión máx. (kg)",g("fuerza"),"kg")}</div>`;
}
function vEvol(p, el){
  if(!(p.evaluaciones||[]).length){ el.innerHTML='<div class="empty">Cargá al menos una evaluación para ver la evolución.</div>'; return; }
  el.innerHTML = graficos(p);
}

  </div></div>

function htmlPlanCalc(p){
  const pl=p.plan, ev=ultimaEval(p); if(!ev) return "";
  const g=gastoEnergetico(p,ev,pl.factor); if(!g) return '<p class="note">Faltan peso, talla, sexo o fecha de nacimiento.</p>';
  const kcal=g.get+(num(pl.ajuste)||0), peso=num(ev.peso);
  const pr=num(pl.prot)||0, hc=num(pl.hc)||0, gr=num(pl.gr)||0, tot=pr+hc+gr;
  const gP=kcal*pr/100/4, gH=kcal*hc/100/4, gG=kcal*gr/100/9;
  let h=`<div class="res">${caja("Metabolismo basal",Math.round(g.tmb)+" kcal")}${caja("Gasto total estimado",Math.round(g.get)+" kcal")}${caja("Valor calórico del plan",Math.round(kcal)+" kcal",null,(num(pl.ajuste)||0)<0?"Con déficit de "+Math.abs(num(pl.ajuste))+" kcal":"")}
  ${caja("Proteínas",Math.round(gP)+" g",null,peso?r1(gP/peso)+" g/kg de peso":"")}${caja("Hidratos de carbono",Math.round(gH)+" g",null,peso?r1(gH/peso)+" g/kg":"")}${caja("Grasas",Math.round(gG)+" g")}</div>`;
  if(tot!==100) h+=`<p class="note" style="color:var(--bad)">⚠ Los porcentajes suman ${tot}%, deberían sumar 100%.</p>`;
  if(p.sexo==="F"&&kcal<1200||p.sexo==="M"&&kcal<1500) h+=`<p class="note" style="color:var(--warn)">⚠ Valor calórico bajo: revisar que sea adecuado y sostenible para este paciente.</p>`;
  return h;
}

function vInforme(p, el){
  el.innerHTML=`<div class="card"><div class="row"><label style="flex-direction:row;align-items:center;gap:6px;color:var(--ink)"><input type="checkbox" id="oG" checked> Incluir gráficos</label>
  <label style="flex-direction:row;align-items:center;gap:6px;color:var(--ink)"><input type="checkbox" id="oP" checked> Incluir plan alimentario</label>
  <button class="btn" id="btnPrint">Imprimir / Guardar PDF</button></div><p class="note">Para PDF: en la ventana de impresión elegí "Guardar como PDF".</p></div><div class="card" id="prev"></div>`;
  const opts=()=>({graficos:el.querySelector("#oG").checked, plan:el.querySelector("#oP").checked});
  const pintar=()=>{ el.querySelector("#prev").innerHTML=htmlInforme(p,opts()); };
  el.querySelector("#oG").onchange=el.querySelector("#oP").onchange=pintar;
  el.querySelector("#btnPrint").onclick=()=>{ document.getElementById("print-area").innerHTML=htmlInforme(p,opts()); window.print(); };
  pintar();
}

/* ---- Portal del paciente ---- */
const LOGO = () => document.querySelector("header.top img").src;
const ESTADOS_META = [["pend","Pendiente"],["camino","En camino"],["ok","¡Logrado!"]];
function portalDe(p){
  p.portal = p.portal || {mensaje:"", sugerencias:"", metas:[], proximaCita:"", horaCita:"", pesoObjetivo:"", incluirPlan:true, incluirIndicadores:true, incluirHistorial:true};
  return p.portal;
}
function vPortal(p, el){
  const po = portalDe(p);
  const puedeCompartir = (()=>{ try{ return !!(navigator.canShare && navigator.canShare({files:[new File(["x"],"x.html",{type:"text/html"})]})); }catch(e){ return false; } })();
  el.innerHTML = `
  <div class="aviso"><b>¿Cómo funciona?</b> Acá armás una página personal para ${esc((p.nombre||"el paciente").split(" ")[0])}, pensada para verse en el celular: su progreso con gráficos, sus metas, tus sugerencias y su plan. Se la mandás por WhatsApp o mail como archivo y la abre sin instalar nada. Cuando cargues una nueva evaluación, volvé a enviársela para que vea lo último.</div>
  <div class="portalWrap"><div>
    <div class="card"><h3>Mensaje para el paciente</h3>
      <textarea data-o="mensaje" style="width:100%" placeholder="Ej.: ¡Muy buen mes! Se nota el esfuerzo con las caminatas. Sigamos así.">${esc(po.mensaje)}</textarea></div>
    <div class="card"><h3>Metas</h3>
      <div id="metas"></div>
      <div class="row"><button class="btn sec" id="btnMeta">+ Agregar meta</button>
      <label style="flex-direction:row;align-items:center;gap:8px;margin-left:auto">Peso objetivo (kg)<input type="number" step="0.1" data-o="pesoObjetivo" value="${esc(po.pesoObjetivo)}" style="width:100px"></label></div>
      <p class="note">Si cargás un peso objetivo, el paciente ve una barra con cuánto le falta.</p></div>
    <div class="card"><h3>Sugerencias</h3><p class="note">Una por renglón. Se muestran como lista.</p>
      <textarea data-o="sugerencias" style="width:100%;min-height:120px" placeholder="Tomar 2 litros de agua por día&#10;Caminar 30 minutos, 4 veces por semana&#10;Sumar verduras en almuerzo y cena">${esc(po.sugerencias)}</textarea></div>
    <div class="card"><h3>Próxima consulta</h3><div class="grid">
      <label>Fecha<input type="date" data-o="proximaCita" value="${esc(po.proximaCita)}"></label>
      <label>Hora<input type="time" data-o="horaCita" value="${esc(po.horaCita)}"></label></div></div>
    <div class="card"><h3>Qué más incluir</h3><div class="checks">
      <label><input type="checkbox" data-k="incluirIndicadores" ${po.incluirIndicadores!==false?"checked":""}> Indicadores de salud (IMC, cintura, presión)</label>
      <label><input type="checkbox" data-k="incluirPlan" ${po.incluirPlan!==false?"checked":""}> Plan alimentario y recomendaciones</label>

    <div class="card"><h3>Enviar al paciente</h3>
      ${baseWeb()?`<div class="row" style="margin-bottom:10px"><button class="btn" id="btnLinkWa">Enviar link por WhatsApp</button><button class="btn sec" id="btnLinkCopiar">Copiar link</button></div>
      <p class="note" style="margin-top:0">El link está protegido: el paciente entra con su <b>DNI</b> (cargalo en la Ficha). Con el link, el paciente puede instalar NutriSan en su celular y le aparece el logo en la pantalla de inicio. También podés mandarle el archivo:</p>`
      :`<p class="note" style="margin-top:0">Cuando NutriSan esté publicado en internet, acá vas a poder mandar un link para que el paciente lo instale como app. Por ahora, mandale el archivo:</p>`}

      <p class="note">${puedeCompartir?"Compartir abre el menú del celular para elegir WhatsApp u otra app.":"Descargá el archivo y adjuntalo en WhatsApp Web o en un mail."} El paciente solo tiene que tocar el archivo para abrirlo.</p></div>
  </div>
  <div class="telefono"><div class="cap">Así lo ve el paciente</div><iframe id="prevPortal" title="Vista del paciente"></iframe></div></div>`;
  const prev = el.querySelector("#prevPortal");
  let tPrev=null;
  const pintar = ()=>{ clearTimeout(tPrev); tPrev=setTimeout(()=>{ prev.srcdoc = htmlPaciente(p); }, 250); };
  const pintarMetas = ()=>{
    const c = el.querySelector("#metas");
    c.innerHTML = (po.metas||[]).length ? po.metas.map((m,i)=>`<div class="metaFila"><input data-mt="${i}" value="${esc(m.texto)}" placeholder="Ej.: Desayunar todos los días"><select data-ms="${i}">${ESTADOS_META.map(([v,t])=>`<option value="${v}" ${m.estado===v?"selected":""}>${t}</option>`).join("")}</select><button data-md="${i}" title="Quitar">✕</button></div>`).join("") : '<p class="note">Todavía no hay metas.</p>';
    c.querySelectorAll("[data-mt]").forEach(i=>i.oninput=()=>{ po.metas[+i.dataset.mt].texto=i.value; guardar(); pintar(); });

  el.querySelector("#btnMeta").onclick=()=>{ (po.metas=po.metas||[]).push({texto:"",estado:"pend"}); guardar(); pintarMetas(); const ins=el.querySelectorAll("[data-mt]"); if(ins.length) ins[ins.length-1].focus(); };

  };
  const bc=el.querySelector("#btnCompartir");
  if(bc) bc.onclick=async()=>{
    const {nombre, html}=archivo();
    try{ await navigator.share({files:[new File([html], nombre, {type:"text/html"})], title:"Mi progreso – NutriSan", text:"¡Hola! Te comparto tu progreso y tus sugerencias. Abrí el archivo para verlo."}); }catch(e){}
  };
  const bw=el.querySelector("#btnLinkWa");
  if(bw) bw.onclick=async()=>{
    const url=await linkPaciente(p), tel=soloNum(p.telefono); if(!url) return;
    const txt="¡Hola "+((p.nombre||"").split(" ")[0]||"")+"! Te comparto tu portal de NutriSan con tu progreso, metas y sugerencias. Para entrar, usá tu DNI (solo números). Abrilo y agregalo a tu pantalla de inicio:\n"+url;
    window.open("https://wa.me/"+(tel.length>=10?tel:"")+"?text="+encodeURIComponent(txt),"_blank");
  };
  const bcp=el.querySelector("#btnLinkCopiar");
  if(bcp) bcp.onclick=async()=>{ const url=await linkPaciente(p); if(!url) return; try{ await navigator.clipboard.writeText(url); bcp.textContent="¡Link copiado!"; }catch(e){ prompt("Copiá este link:", url); } setTimeout(()=>bcp.textContent="Copiar link",2000); };
  pintarMetas();
  prev.srcdoc = htmlPaciente(p);
}

/* Página estática para el paciente: sin JavaScript, para que se abra en cualquier celular (incluso en la vista previa de WhatsApp o iPhone) */
function htmlPaciente(p, opts={}){
  const po = portalDe(p), pf = db.profesional||{};
  const evs = ordenadas(p), u = evs[evs.length-1], pr = evs[0];
  const Ru = u?calcular(p,u):null, Rp = pr?calcular(p,pr):null;
  const nombre1 = esc((p.nombre||"").trim().split(/\s+/)[0]||"");
  const delta = (a,b)=> a!=null&&b!=null ? b-a : null;
  const flecha = d => d==null ? "" : d<0 ? "▼ " : d>0 ? "▲ " : "";
  const sg = d => (d>0?"+":"")+r1(d);
  let h = "";

  // Próxima consulta + mensaje
  if(po.proximaCita){
    const dias=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
    const d=new Date(po.proximaCita+"T12:00:00");
    h += `<section class="cita"><div class="ico">📅</div><div><div class="k">Tu próxima consulta</div><div class="v"><span class="dia">${dias[d.getDay()]}</span> ${fmtF(po.proximaCita)}${po.horaCita?" · "+esc(po.horaCita)+" h":""}</div></div></section>`;
  }
  if((po.mensaje||"").trim()) h += `<section class="card msg"><div class="k">Mensaje de tu nutricionista</div><p>${esc(po.mensaje)}</p>${pf.nombre?`<div class="firma">— ${esc(pf.nombre)}</div>`:""}</section>`;

  // Progreso
  if(u){
    const pesoU=num(u.peso), pesoP=num(pr.peso), obj=num(po.pesoObjetivo);
    const stat=(k,v,un,d,unD)=>`<div class="stat"><div class="k">${k}</div><div class="v">${v==null?"–":r1(v)}<small> ${un}</small></div>${evs.length>1&&d!=null?`<div class="d">${flecha(d)}${sg(d)} ${unD} desde el inicio</div>`:""}</div>`;
    h += `<h2>Tu progreso</h2><div class="stats">
      ${stat("Peso",pesoU,"kg",delta(pesoP,pesoU),"kg")}
      ${num(u.cintura)!=null?stat("Cintura",num(u.cintura),"cm",delta(num(pr.cintura),num(u.cintura)),"cm"):""}
      ${Ru.grasa!=null?stat("Grasa corporal",Ru.grasa,"%",delta(Rp.grasa,Ru.grasa),"%"):""}
      ${Ru.mlg!=null?stat("Masa magra",Ru.mlg,"kg",delta(Rp.mlg,Ru.mlg),"kg"):""}
    </div>`;
    if(obj && pesoP && pesoU && pesoP!==obj){
      const pct=Math.max(0,Math.min(100,(pesoP-pesoU)/(pesoP-obj)*100));
      const falta=Math.abs(pesoU-obj);
      h += `<section class="card"><div class="k">Camino a tu peso objetivo (${r1(obj)} kg)</div><div class="barra"><span style="width:${pct.toFixed(0)}%"></span></div>
        <div class="note">${pct>=100?"¡Llegaste a tu objetivo! 🎉":`Llevás el ${pct.toFixed(0)}% del camino · te faltan ${r1(falta)} kg`}</div></section>`;
    }
    // Logros automáticos
    if(evs.length>1){
      const L=[]; const dP=delta(pesoP,pesoU), dC=delta(num(pr.cintura),num(u.cintura)), dG=delta(Rp.grasa,Ru.grasa), dM=delta(Rp.mlg,Ru.mlg), dF=delta(Rp.dMax,Ru.dMax);
      const bajar = !obj || (pesoP && obj<pesoP);
      if(dP!=null && bajar && dP<=-0.5) L.push(`Bajaste <b>${r1(-dP)} kg</b> de peso`);
      if(dP!=null && !bajar && dP>=0.5) L.push(`Subiste <b>${r1(dP)} kg</b> de peso`);
      if(dC!=null && dC<=-1) L.push(`Tu cintura tiene <b>${r1(-dC)} cm</b> menos`);
      if(dG!=null && dG<=-0.5) L.push(`Redujiste <b>${r1(-dG)} puntos</b> de grasa corporal`);
      if(dM!=null && dM>=0.3) L.push(`Ganaste <b>${r1(dM)} kg</b> de masa magra (músculo)`);
      if(dF!=null && dF>=1) L.push(`Tenés <b>${r1(dF)} kg</b> más de fuerza en las manos`);
      L.push(`Hiciste <b>${evs.length} controles</b> desde el ${fmtF(pr.fecha)}`);
      h += `<section class="card logros"><div class="k">Tus logros</div><ul>${L.map(x=>`<li>${x}</li>`).join("")}</ul></section>`;
    }
    // Gráficos
    if(evs.length>1){
      const d=datosEvol(p); const g=k=>d.map(x=>({f:x.f,v:x[k]}));
      const conDatos=k=>d.filter(x=>x[k]!=null).length>1;
      h += `<h2>Tu evolución</h2><div class="charts">${svgLinea("Peso (kg)",g("peso"),"kg")}${conDatos("cin")?svgLinea("Cintura (cm)",g("cin"),"cm"):""}${conDatos("grasa")?svgLinea("% de grasa",g("grasa"),"%"):""}${conDatos("mlg")?svgLinea("Masa magra (kg)",g("mlg"),"kg"):""}</div>`;
    }
    // Indicadores
    if(po.incluirIndicadores!==false){
      let ind = "";
      if(Ru.imc) ind += caja("Índice de masa corporal", r1(Ru.imc), Ru.imcClas);
      if(Ru.cinClas) ind += caja("Cintura", r1(num(u.cintura))+" cm", Ru.cinClas);
      if(Ru.ict!=null) ind += caja("Cintura / altura", r2(Ru.ict), Ru.ictClas);
      if(num(u.paSist)&&num(u.paDiast)){ const s=num(u.paSist), dd=num(u.paDiast); ind+=caja("Presión arterial", s+"/"+dd, s>=140||dd>=90?["Elevada","bad"]:s>=130||dd>=85?["Normal alta","warn"]:["Normal","ok"]); }
      if(Ru.dClas) ind += caja("Fuerza de las manos", r1(Ru.dMax)+" kg", Ru.dClas[1]==="ok"?["Buena fuerza","ok"]:["Para mejorar","warn"]);
      if(ind) h += `<h2>Tus indicadores</h2><div class="res">${ind}</div><p class="note">Medición del ${fmtF(u.fecha)}. Tu nutricionista te explica qué significa cada uno en la consulta.</p>`;
    }
  } else {
    h += `<section class="card"><p>Todavía no hay mediciones cargadas. Las vas a ver acá después de tu primera evaluación.</p></section>`;
  }

  // Metas
  const metas=(po.metas||[]).filter(m=>(m.texto||"").trim());
  if(metas.length){
    const ico={pend:"○",camino:"◐",ok:"✓"}, txt={pend:"Pendiente",camino:"En camino",ok:"¡Logrado!"};
    h += `<h2>Tus metas</h2><section class="card"><ul class="metas">${metas.map(m=>`<li class="${esc(m.estado||"pend")}"><span class="mi">${ico[m.estado]||"○"}</span><span class="mt">${esc(m.texto)}</span><span class="me">${txt[m.estado]||"Pendiente"}</span></li>`).join("")}</ul></section>`;
  }
  // Sugerencias
  const sug=(po.sugerencias||"").split("\n").map(x=>x.replace(/^[\s•\-–*]+/,"").trim()).filter(Boolean);
  if(sug.length) h += `<h2>Sugerencias para vos</h2><section class="card"><ul class="sug">${sug.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></section>`;

  // Plan
  if(po.incluirPlan!==false && p.plan){
    const pl=p.plan, com=COMIDAS.filter(([k])=>((pl.comidas||{})[k]||"").trim());
    if(com.length) h += `<h2>Tu plan alimentario</h2>${com.map(([k,t])=>`<section class="card comida"><div class="k">${t}</div><div class="pre">${esc(pl.comidas[k])}</div></section>`).join("")}`;
    if((pl.recomendaciones||"").trim()) h += `<h2>Recomendaciones</h2><section class="card"><div class="pre">${esc(pl.recomendaciones)}</div></section>`;
  }
  // Historial
  if(po.incluirHistorial!==false && evs.length){
    h += `<h2>Historial de mediciones</h2><section class="card tblw"><table><tr><th>Fecha</th><th>Peso</th><th>Cintura</th><th>% grasa</th></tr>${[...evs].reverse().map(e=>{const R=calcular(p,e); return `<tr><td>${fmtF(e.fecha)}</td><td>${r1(num(e.peso))} kg</td><td>${num(e.cintura)!=null?r1(num(e.cintura))+" cm":"–"}</td><td>${R.grasa!=null?r1(R.grasa)+"%":"–"}</td></tr>`;}).join("")}</table></section>`;
  }

  const wa = soloNum(pf.whatsapp);
  const pie = `<footer>${wa?`<a class="wa" href="https://wa.me/${wa}?text=${encodeURIComponent("Hola, soy "+(p.nombre||"")+". Te escribo por mi plan de NutriSan.")}">💬 Escribir a mi nutricionista</a>`:""}
    <div class="prof"><b>${esc(pf.nombre||"")}</b><br>${esc(pf.titulo||"")}${pf.matricula?"<br>Mat. "+esc(pf.matricula):""}${pf.contacto?"<br>"+esc(pf.contacto):""}</div>
    <div class="note">Actualizado el ${fmtF(FECHA_ACT||hoy())}. Esta información acompaña la consulta profesional y no reemplaza la evaluación médica.</div></footer>`;

  return `<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

let FECHA_ACT = null;
const b64u = bytes => { let s=""; for(let i=0;i<bytes.length;i++) s+=String.fromCharCode(bytes[i]); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); };
const unb64u = t => { const s=atob(t.replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from(s,c=>c.charCodeAt(0)); };
async function empaquetar(obj){
  const raw=new TextEncoder().encode(JSON.stringify(obj));
  if(window.CompressionStream){ const st=new Blob([raw]).stream().pipeThrough(new CompressionStream("deflate-raw")); return "z"+b64u(new Uint8Array(await new Response(st).arrayBuffer())); }
  return "j"+b64u(raw);
}
async function desempaquetar(t){
  let b=unb64u(t.slice(1));
  if(t[0]==="z"){ const st=new Blob([b]).stream().pipeThrough(new DecompressionStream("deflate-raw")); b=new Uint8Array(await new Response(st).arrayBuffer()); }
  return JSON.parse(new TextDecoder().decode(b));
}
// Solo lo que el paciente necesita ver: sin DNI, antecedentes, medicación ni notas internas
function datosParaPaciente(p){
  const pf=db.profesional||{};
  return {v:1, f:hoy(), pf:{nombre:pf.nombre, titulo:pf.titulo, matricula:pf.matricula, contacto:pf.contacto, whatsapp:pf.whatsapp},
    p:{id:p.id, nombre:p.nombre, sexo:p.sexo, nacimiento:p.nacimiento,
       evaluaciones:(p.evaluaciones||[]).map(e=>{ const c=Object.assign({},e); delete c.notas; return c; }),
       plan:p.plan?{comidas:p.plan.comidas, recomendaciones:p.plan.recomendaciones}:null, portal:portalDe(p)}};
}
const baseWeb = () => { const w=((db.profesional||{}).web||"").trim(); if(w) return w.split("#")[0]; return /^https?:/.test(location.protocol)? location.origin+location.pathname : ""; };
/* ---- Link del paciente protegido con su DNI (cifrado AES-GCM; el DNI nunca viaja en el link) ---- */
async function claveDni(dni, salt){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode("nutrisan-dni:"+soloNum(dni)), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:200000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function cifrarParaPaciente(obj, dni){
  const raw = new TextEncoder().encode(JSON.stringify(obj));
  let datos = raw, z = "0";
  if(window.CompressionStream){ const st=new Blob([raw]).stream().pipeThrough(new CompressionStream("deflate-raw")); datos=new Uint8Array(await new Response(st).arrayBuffer()); z="1"; }
  const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM", iv}, await claveDni(dni, salt), datos));
  const todo=new Uint8Array(28+ct.length); todo.set(salt,0); todo.set(iv,16); todo.set(ct,28);
  return "e"+z+b64u(todo);
}
async function descifrarConDni(t, dni){
  const b=unb64u(t.slice(2)), salt=b.slice(0,16), iv=b.slice(16,28), ct=b.slice(28);
  let datos=new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM", iv}, await claveDni(dni, salt), ct)); // falla si el DNI no coincide
  if(t[1]==="1"){ const st=new Blob([datos]).stream().pipeThrough(new DecompressionStream("deflate-raw")); datos=new Uint8Array(await new Response(st).arrayBuffer()); }
  return JSON.parse(new TextDecoder().decode(datos));
}

    catch(e){ err.textContent="El DNI no coincide. Revisalo e intentá de nuevo."; inp.value=""; btn.disabled=false; btn.textContent="Entrar"; }
  };
  btn.onclick=entrar; inp.onkeydown=e=>{ if(e.key==="Enter") entrar(); }; inp.focus();
}
async function linkPaciente(p){
  const b=baseWeb(); if(!b) return "";
  if(soloNum(p.dni).length<6){ alert("Para enviar el link, primero cargá el DNI del paciente en la Ficha: es su clave para entrar."); return ""; }
  return b+"#s="+await cifrarParaPaciente(datosParaPaciente(p), p.dni);
}

/* ---- Acceso: profesional (con PIN) o paciente ---- */
const PIN_KEY = "nutrisan_pin";
async function hashPin(pin){
  const txt = "nutrisan:"+pin;
  if(window.crypto && crypto.subtle){ const b=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
  let h=0; for(const c of txt) h=(h*31+c.charCodeAt(0))|0; return "s"+h;
}
const lsGet = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
const lsSet = (k,v) => { try{ localStorage.setItem(k,v); }catch(e){} };
const ssGet = k => { try{ return sessionStorage.getItem(k); }catch(e){ return null; } };
const ssSet = (k,v) => { try{ v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v); }catch(e){} };

function pantallaAcceso(alEntrar){
  const hayPin = !!lsGet(PIN_KEY);
  const div = document.createElement("div"); div.id="acceso";
  div.innerHTML = `<div class="accCaja">
    <img src="${LOGO()}" alt="NutriSan"><div class="accMarca">NutriSan</div><div class="accTag">EQUILIBRIO · SALUD · BIENESTAR</div>
    <div id="accPaso1">
      <button class="accBtn" id="accProf">👩‍⚕️ Soy profesional</button>
      <button class="accBtn sec" id="accPac">🌱 Soy paciente</button>
    </div>
    <div id="accProfForm" hidden>
      <p>${hayPin?"Ingresá tu PIN de profesional":"Primera vez en este dispositivo: creá un PIN de 4 a 8 números para proteger los datos de tus pacientes."}</p>
      <input id="accPin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="PIN">
      ${hayPin?"":'<input id="accPin2" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="Repetí el PIN">'}
      <div class="accErr" id="accErr"></div>
      <button class="accBtn" id="accEntrar">${hayPin?"Entrar":"Crear PIN y entrar"}</button>
      <button class="accLink" id="accVolver1">← Volver</button>
    </div>
    <div id="accPacInfo" hidden>
      <p><b>¿Sos paciente de NutriSan?</b></p>
      <p>Tu nutricionista te envía por WhatsApp un <b>link personal</b>. Abrilo desde ese mensaje y entrá con tu <b>DNI</b> para ver tu progreso, tus metas y tu plan.</p>
      <p class="accNota">Después de abrirlo, podés agregarlo a la pantalla de inicio del celular para tenerlo siempre a mano.</p>
      <button class="accLink" id="accVolver2">← Volver</button>
    </div>
  </div>`;
  document.body.appendChild(div);
  const $=id=>div.querySelector("#"+id), ver=(a)=>{ ["accPaso1","accProfForm","accPacInfo"].forEach(x=>$(x).hidden=x!==a); };
  $("accProf").onclick=()=>{ ver("accProfForm"); $("accPin").focus(); };
  $("accPac").onclick=()=>ver("accPacInfo");
  $("accVolver1").onclick=$("accVolver2").onclick=()=>ver("accPaso1");
  const entrar=async()=>{
    const p=$("accPin").value.trim(), err=$("accErr"); err.textContent="";
    if(!/^\d{4,8}$/.test(p)){ err.textContent="El PIN tiene que tener de 4 a 8 números."; return; }
    if(!hayPin){
      if(p!==$("accPin2").value.trim()){ err.textContent="Los dos PIN no coinciden."; return; }
      lsSet(PIN_KEY, await hashPin(p));
    } else if(await hashPin(p)!==lsGet(PIN_KEY)){ err.textContent="PIN incorrecto."; $("accPin").value=""; return; }
    ssSet("nutrisan_ok","1"); div.remove(); alEntrar();
  };
  $("accEntrar").onclick=entrar;
  div.querySelectorAll("input").forEach(i=>i.onkeydown=e=>{ if(e.key==="Enter") entrar(); });
}
function cerrarSesion(){ ssSet("nutrisan_ok",null); location.reload(); }
function cambiarPin(){
  if(!confirm("¿Querés cambiar el PIN de profesional? Vas a crear uno nuevo al volver a entrar. Tus pacientes no se borran.")) return;
  try{ localStorage.removeItem(PIN_KEY); }catch(e){} cerrarSesion();
}

async function arrancar(){
  const hs = location.hash.indexOf("#s=")===0 ? location.hash.slice(3) : "";
  if(hs){ pantallaDni(hs); return; }
  let t = location.hash.indexOf("#p=")===0 ? location.hash.slice(3) : "";
  const standalone = window.matchMedia && (window.matchMedia("(display-mode: standalone)").matches || navigator.standalone);
  if(!t && standalone){ try{ t=localStorage.getItem("nutrisan_portal")||""; }catch(e){} }
  if(t && t[0]==="e"){ pantallaDni(t); return; }
  if(t){
    try{
      const d=await desempaquetar(t);
      try{ localStorage.setItem("nutrisan_portal", t); }catch(e){}
      db={version:1, profesional:d.pf||{}, pacientes:[d.p]}; FECHA_ACT=d.f||null;
      const html=htmlPaciente(d.p,{web:true});
      document.open(); document.write(html); document.close();
    }catch(e){
      document.documentElement.style.visibility="";
      document.body.innerHTML='<div class="empty"><h2>No se pudo abrir tu portal</h2><p>Pedile a tu nutricionista que te reenvíe el link completo.</p></div>';
    }
    return;
  }
  if(/^https:/.test(location.protocol)){
    document.head.insertAdjacentHTML("beforeend", headWeb());
    if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
  }
  const iniciar=()=>{ pintarProf(); renderLista(); render(); marcarEstado(db.pacientes.length? db.pacientes.length+" pacientes" : ""); };
  if(ssGet("nutrisan_ok")==="1") iniciar(); else pantallaAcceso(iniciar);
}
